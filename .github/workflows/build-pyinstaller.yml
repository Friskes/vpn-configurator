name: Build PyInstaller Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
      force-rebuild:
        description: "Rebuild even if the release already has all assets"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    if: github.actor == 'Friskes'
    uses: ./.github/workflows/tests.yml

  check-release:
    if: github.actor == 'Friskes'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if release already contains all assets
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          RESPONSE=$(mktemp)
          STATUS=$(curl -s -o "$RESPONSE" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/v$VERSION)
          if [ "$STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "200" ]; then
            FOUND=$(jq --arg v "$VERSION" \
              '[.assets[].name] as $names |
               ["vpn_configurator_v\($v).exe",
                "vpn_configurator_v\($v).macos-arm64.zip",
                "vpn_configurator_v\($v).macos-x86_64.zip"] |
               map(. as $n | $names | index($n) != null) | all' "$RESPONSE")
            if [ "$FOUND" = "true" ]; then
              echo "Release v$VERSION already contains all assets. Skipping build."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release v$VERSION is incomplete — rebuilding missing assets."
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "GitHub API returned unexpected status $STATUS — failing instead of guessing."
            exit 1
          fi

  build-windows:
    if: github.actor == 'Friskes' && (needs.check-release.outputs.exists != 'true' || github.event.inputs.force-rebuild == 'true')
    needs: [test, check-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Windows binary
        run: |
          uv run --frozen pyinstaller -w -F --collect-all customtkinter --collect-all tkinterdnd2 vpn_configurator.py

      - name: Rename binary with version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          mv dist/vpn_configurator.exe "vpn_configurator_v${env:VERSION}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: vpn_configurator_windows
          path: vpn_configurator_v${{ github.event.inputs.version }}.exe

  build-macos-arm64:
    if: github.actor == 'Friskes' && (needs.check-release.outputs.exists != 'true' || github.event.inputs.force-rebuild == 'true')
    needs: [test, check-release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build macOS arm64 .app bundle
        run: |
          uv run --frozen pyinstaller -w -F --collect-all customtkinter --collect-all tkinterdnd2 vpn_configurator.py

      - name: Check binary architecture
        run: |
          file dist/vpn_configurator.app/Contents/MacOS/vpn_configurator

      - name: Package .app into zip
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          ditto -c -k --keepParent dist/vpn_configurator.app "vpn_configurator_v${VERSION}.macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: vpn_configurator_macos_arm64
          path: vpn_configurator_v${{ github.event.inputs.version }}.macos-arm64.zip

  build-macos-x86_64:
    if: github.actor == 'Friskes' && (needs.check-release.outputs.exists != 'true' || github.event.inputs.force-rebuild == 'true')
    needs: [test, check-release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rosetta 2
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install x86_64 Python
        run: |
          uv python install cpython-3.12-macos-x86_64

      - name: Build macOS x86_64 .app bundle
        run: |
          uv run --frozen --python cpython-3.12-macos-x86_64 pyinstaller -w -F --collect-all customtkinter --collect-all tkinterdnd2 vpn_configurator.py

      - name: Check binary architecture
        run: |
          file dist/vpn_configurator.app/Contents/MacOS/vpn_configurator

      - name: Package .app into zip
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          ditto -c -k --keepParent dist/vpn_configurator.app "vpn_configurator_v${VERSION}.macos-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: vpn_configurator_macos_x86_64
          path: vpn_configurator_v${{ github.event.inputs.version }}.macos-x86_64.zip

  publish-release:
    if: github.actor == 'Friskes'
    needs: [build-windows, build-macos-arm64, build-macos-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vpn_configurator_windows
          path: artifacts/

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: vpn_configurator_macos_arm64
          path: artifacts/

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: vpn_configurator_macos_x86_64
          path: artifacts/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          files: |
            artifacts/vpn_configurator_v${{ github.event.inputs.version }}.exe
            artifacts/vpn_configurator_v${{ github.event.inputs.version }}.macos-arm64.zip
            artifacts/vpn_configurator_v${{ github.event.inputs.version }}.macos-x86_64.zip
