[project]
name = "vpn-configurator"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter==5.2.2",
    "tkinterdnd2==0.6.2",
]

[dependency-groups]
dev = [
    "pyinstaller==6.13.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
